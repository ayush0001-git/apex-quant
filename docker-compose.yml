# Apex Quant-Terminal v1.2.0 Compose Specification
services:
  apex-terminal:
    build: .
    container_name: apex-quant-terminal
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - APEX_ENV=production
    restart: unless-stopped
