# apex-quant/config/settings.yaml
# Production Configuration for Apex Quant-Terminal (NSE/BSE)

timeframes:
  regime: "1d"
  structure: "1h"
  trigger: "15m"

risk:
  max_position_pct: 0.01
  max_daily_drawdown_pct: 0.02
  consecutive_loss_throttle: 3
  min_friction_multiplier: 3.5
  max_portfolio_var_pct: 0.03
  max_portfolio_cvar_pct: 0.05
  max_asset_correlation: 0.70
  max_sector_exposure_pct: 0.25
  llm_defensive_throttle: true
  max_notional_leverage: 1.0
  max_adv_pct: 0.02

friction:
  brokerage_per_order: 20.0
  stt_intraday_pct: 0.00025
  stt_delivery_buy_pct: 0.0010
  stt_delivery_sell_pct: 0.0010
  gst_pct: 0.18
  exchange_turnover_pct: 0.0000325
  sebi_turnover_pct: 0.000001
  stamp_duty_pct: 0.00015
  stamp_duty_delivery_pct: 0.00015
  stamp_duty_intraday_pct: 0.00003
  default_slippage_pct: 0.0007
  min_slippage_pct: 0.0002
  max_slippage_pct: 0.0050
  slippage_vol_factor: 0.6
  slippage_impact_factor: 0.15

llm:
  scan_model: "free_pool"
  synth_model: "paid_gate"
  synth_timeout_s: 30

data:
  primary: "yfinance"
  fallback: "mock"

execution:
  mode: "paper"
  algo_id: "APEX_PAPER_ADVISORY_V1"
